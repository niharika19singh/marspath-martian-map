name: Backend CI & Quality Checks

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest ruff

      - name: Shell Script Syntax Validation
        run: |
          bash -n backend/scripts/provision_build_dem.sh
          bash -n backend/scripts/start_render.sh

      - name: Run Ruff Lint Checks (Blocking)
        run: |
          ruff check backend/

      - name: Run Pytest Suite (Full Backend, Provenance, Provisioning, Runtime & API Tests)
        env:
          PYTHONPATH: .
        run: |
          pytest -v backend/tests/
